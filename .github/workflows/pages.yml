name: Deploy to GitHub Pages

# Builds the static export (NEXT_PUBLIC_STATIC_EXPORT=1) and publishes it to
# https://deshiklab.github.io/al_muraqib_web/
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - arena/01a0d89a-al-muraqib-web
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Static export build
        run: NEXT_PUBLIC_STATIC_EXPORT=1 npm run build

      - name: Generate locale-aware index redirect
        run: node scripts/static-index.cjs

      - name: Enable Pages (if not already)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
